<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Morning Set</title>
<style>
:root{--bg:#0b0f14;--card:#131a22;--card2:#1a232e;--line:#263241;--tx:#e8eef4;--mu:#8d9bab;--ac:#6ee7b7;--ac2:#34d399;--rest:#fbbf24;--warn:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
/* top bar */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(11,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
@media (max-width:460px){#bar .brand{display:none}}
#bar{justify-content:flex-end}
#bar .brand{font-weight:700;letter-spacing:.3px;font-size:15px;color:var(--mu);margin-right:auto;white-space:nowrap}
.tog{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:var(--card2);border:1px solid var(--line);font-size:15px;font-weight:600;white-space:nowrap}
.tog.on{background:rgba(110,231,183,.14);border-color:var(--ac);color:var(--ac)}
.tog .ic{font-size:18px}
#vol{width:80px;flex:1;max-width:140px;min-width:60px;accent-color:var(--ac);height:32px}
.screen{padding:calc(70px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
/* start */
h1{font-size:30px;margin:6px 0 2px}
.sub{color:var(--mu);font-size:16px;margin:0 0 14px}
.days{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}
.day{flex:1;min-width:44px;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--mu)}
.day.today{color:var(--tx)}
.day.sel{background:var(--ac);color:#062b1e;border-color:var(--ac)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;height:64px;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg button b{font-size:22px}.seg button span{font-size:12px;color:var(--mu)}
.seg button.sel{background:var(--card2);box-shadow:inset 0 0 0 2px var(--ac)}
.streak{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.streak b{font-size:20px;color:var(--rest)}
.list{list-style:none;margin:0 0 120px;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.list svg{width:64px;height:48px;flex:none}
.list .nm{font-weight:600;font-size:16px}.list .mt{color:var(--mu);font-size:13px}
.list .no{color:var(--mu);font-size:13px;width:18px;text-align:right;flex:none}
#goWrap{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:10}
#go{display:block;width:100%;max-width:788px;margin:0 auto;height:76px;border-radius:38px;background:var(--ac);color:#05261a;font-size:30px;font-weight:800;letter-spacing:2px;box-shadow:0 8px 30px rgba(110,231,183,.25)}
#go small{display:block;font-size:13px;letter-spacing:0;font-weight:600;opacity:.75;margin-top:-4px}
/* play */
#play{display:flex;flex-direction:column;gap:8px;height:100vh;height:100dvh;overflow:hidden;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#play .info{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.prog{display:flex;gap:3px;height:6px}
.prog i{flex:1;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--ac2)}.prog i.c{background:var(--ac)}
.phase{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
#endBtn{height:40px;padding:0 14px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--mu);font-size:14px}
.stage{position:relative;background:radial-gradient(ellipse at 50% 70%,#16212c,#0f151c);border:1px solid var(--line);border-radius:20px;height:27vh;min-height:150px;flex:none}
.stage svg{width:100%;height:100%;display:block}
#lead{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:var(--ac);background:rgba(11,15,20,.55);border-radius:20px}
.stage .view{position:absolute;right:12px;top:8px;font-size:12px;color:var(--mu)}
#exName{font-size:28px;font-weight:800;margin:0;line-height:1.1}
#exMeta{color:var(--ac);font-size:17px;font-weight:600;margin-top:4px}
.row{display:flex;gap:14px;align-items:flex-start}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)}.ring .fgc{stroke:var(--ac);transition:stroke .3s}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ring .num span{font-size:13px;color:var(--mu);margin-top:4px}
.cues{margin:0;padding-left:20px;font-size:17px;line-height:1.3}
.cues li{margin-bottom:6px}
.notes{font-size:14px;color:var(--mu);line-height:1.4}
.notes b{color:var(--tx)}
.notes p{margin:4px 0}
#moti{font-style:italic;color:#c9d6e2;font-size:17px;text-align:center;min-height:24px}
.next{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.next svg{width:60px;height:45px}
.next .lb{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}.next .nm{font-size:17px;font-weight:600}
.ctrls{display:flex;justify-content:center;align-items:center;gap:22px;flex:none;padding-top:4px}
.cb{width:72px;height:72px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.cb svg{width:32px;height:32px;fill:var(--tx)}
.cb.big{width:88px;height:88px;background:var(--ac)}.cb.big svg{fill:#05261a;width:40px;height:40px}
.resting .fgc{stroke:var(--rest)}.resting #exMeta{color:var(--rest)}
.resting .stage{opacity:.75}
.paused .ring .num b{opacity:.45}
@media (orientation:landscape) and (min-width:640px){
 #play{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:18px;row-gap:8px}
 #play .prog,#play .phase{grid-column:1/3}
 #play .stage{grid-row:3/5;height:auto;min-height:0}
 #play .info{grid-column:2}
 #play .ctrls{grid-column:2}
 #exName{font-size:22px}#exMeta{font-size:15px}
 .ring{width:104px;height:104px}.ring .num b{font-size:38px}.ring .num span{font-size:11px}
 .cues{font-size:15px}#play .notes,#play .next{display:none}
 .cb{width:60px;height:60px}.cb.big{width:72px;height:72px}
}
/* done */
#done{text-align:center}
#done .big{font-size:72px;margin:10px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:28px}.stat span{color:var(--mu);font-size:13px}
.week{display:flex;justify-content:center;gap:8px;margin:10px 0 18px}
.week div{width:38px;text-align:center;font-size:12px;color:var(--mu)}
.week i{display:block;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--card2);border:1px solid var(--line)}
.week i.y{background:var(--ac);border-color:var(--ac)}
.btn{width:100%;height:68px;border-radius:34px;background:var(--ac);color:#05261a;font-size:24px;font-weight:800}
.log{margin-top:18px;text-align:left;color:var(--mu);font-size:14px}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.fig .lim{fill:none;stroke:var(--ac);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.fig .far{opacity:.42}
.fig .head{fill:var(--ac)}
.floor{stroke:#2d3a4a;stroke-width:3}
.prop{fill:#223040;stroke:#34465a;stroke-width:2}
.wallb{fill:#141d27}
.mat{fill:#121b25;stroke:#223040;stroke-width:2}
.inten{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.ihead{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--mu);font-weight:600}
.ihead b{font-size:20px;color:var(--tx)}
#inten{width:100%;height:44px;accent-color:var(--ac);margin:4px 0 0}
.iticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);padding:0 2px}
.iticks span.on{color:var(--ac);font-weight:700}
.idesc{font-size:13px;color:var(--mu);margin-top:6px;line-height:1.35}
#exTempo{color:var(--mu);font-size:14px;margin-top:2px}
.notes .hl{background:rgba(110,231,183,.1);border-left:3px solid var(--ac);padding:4px 8px;border-radius:4px;color:var(--tx)}
#chip{position:fixed;top:calc(68px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;height:48px;padding:0 20px;border-radius:24px;background:var(--rest);color:#2a1c00;font-weight:800;font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.addons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.btn2{height:76px;border-radius:18px;background:var(--card2);border:2px solid var(--ac);color:var(--ac);font-size:18px;font-weight:800;line-height:1.15;padding:6px}
.btn2 small{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-top:2px}
.btn2.ab{border-color:var(--rest);color:var(--rest)}
.addhint{color:var(--mu);font-size:13px;margin:0 0 8px}
</style>
</head>
<body>
<header id="bar">
 <div class="brand">Morning Set</div>
 <button class="tog" id="musicBtn" aria-label="Music on/off"><span class="ic">♪</span><span id="musicLbl">Music</span></button>
 <input id="vol" type="range" min="0" max="100" aria-label="Music volume">
 <button class="tog" id="cueBtn" aria-label="Voice and beep cues on/off"><span class="ic">🔔</span><span id="cueLbl">Cues</span></button>
</header>
<button id="chip" class="hidden">▶ Tap to start music</button>
<audio id="musicEl" loop preload="auto" playsinline webkit-playsinline></audio>

<main id="start" class="screen">
 <h1 id="sTitle">Today</h1>
 <p class="sub" id="sSub"></p>
 <div class="days" id="days"></div>
 <div class="seg" id="seg"></div>
 <div class="inten">
  <div class="ihead"><span>Intensity</span><b id="iLbl">3 · Moderate</b></div>
  <input id="inten" type="range" min="1" max="5" step="1" aria-label="Intensity 1 to 5">
  <div class="iticks" id="iticks"><span>Easy</span><span>Light</span><span>Moderate</span><span>Hard</span><span>Max</span></div>
  <div class="idesc" id="iDesc"></div>
 </div>
 <div class="streak" id="streak"></div>
 <ul class="list" id="list"></ul>
 <div id="goWrap"><button id="go">GO<small id="goSub"></small></button></div>
</main>

<main id="play" class="screen hidden">
 <div class="prog" id="prog"></div>
 <div class="phase"><span id="phaseLbl">Get ready</span><span id="countLbl"></span><button id="endBtn">End ✕</button></div>
 <div class="stage"><svg id="mainFig" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid meet"></svg><div class="view" id="viewLbl"></div><div id="lead" class="hidden">3</div></div>
 <div class="info">
  <h2 id="exName"></h2>
  <div id="exMeta"></div>
  <div id="exTempo"></div>
  <div class="row">
   <div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44" fill="none" stroke-width="8"/><circle id="ringFg" class="fgc" cx="50" cy="50" r="44" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg><div class="num"><b id="tNum">0</b><span id="tLbl">sec</span></div></div>
   <div style="flex:1;min-width:0"><ol class="cues" id="cues"></ol></div>
  </div>
  <div class="notes" id="notes"></div>
  <div id="moti"></div>
  <div class="next" id="nextBox"><svg id="nextFig" viewBox="0 0 200 150"></svg><div><div class="lb">Up next</div><div class="nm" id="nextName"></div></div></div>
 </div>
 <div class="ctrls">
  <button class="cb" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="cb big" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" id="pauseIc"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
  <button class="cb" id="skipBtn" aria-label="Skip"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
 </div>
</main>

<main id="done" class="screen hidden">
 <div class="big">✓</div>
 <h1 id="dTitle">Session complete</h1>
 <p class="sub" id="dSub"></p>
 <div class="stats">
  <div class="stat"><b id="dStreak">1</b><span>day streak</span></div>
  <div class="stat"><b id="dTime">0:00</b><span>total time moving</span></div>
 </div>
 <div class="week" id="dWeek"></div>
 <p id="dLine" style="color:#c9d6e2;font-style:italic"></p>
 <p class="addhint" id="addHint">Got a few more minutes?</p>
 <div class="addons" id="addons">
  <button class="btn2" id="plusBtn">+5 min<small id="plusSub"></small></button>
  <button class="btn2 ab" id="abBtn">5-min Ab Blast<small id="abSub"></small></button>
 </div>
 <button class="btn" id="doneBtn">Done</button>
 <div class="log" id="dLog"></div>
</main>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
/* ---------- Pose system (stick figures) ---------- */
// keys: h head, n neck/shoulder, c mid-spine (optional), e/w near elbow/wrist, E/W far elbow/wrist, p pelvis, k/a near knee/ankle, K/A far knee/ankle
function parse(s){const o={};s.trim().split(/\s+/).forEach(t=>{const [x,y]=t.slice(1).split(',').map(Number);o[t[0]]=[x,y];});return o;}
function fill(o){[['e','E'],['w','W'],['k','K'],['a','A']].forEach(([l,u])=>{if(!o[u]&&o[l])o[u]=o[l];});return o;}
function P(s,base){const o=Object.assign({},base?fill(parse(base)):{},parse(s));fill(o);if(!o.c)o.c=[(o.n[0]+o.p[0])/2,(o.n[1]+o.p[1])/2];return o;}
const QUAD="h142,82 n128,88 p85,100 e129,109 w130,132 k85,132 a57,133";
const SUP="h34,126 n49,128 p92,129";
const STAND_F="h100,24 n100,40 p100,84 k94,108 a90,134 K106,108 A110,134";

/* ---------- Exercise library ---------- */
const EX={
breath:{name:"Rib-expansion breathing",reps:"slow breaths: 4s in, 6s out",period:10,
 frames:[P("c70,126 e64,114 w76,120 k113,105 a132,134",SUP),P("c70,118 e60,108 w76,117 k113,105 a132,134",SUP)],
 cues:["On your back, knees bent, hands on lower ribs","Inhale 4s through the nose: push ribs out sideways into your hands","Exhale 6s slowly and let the ribs drop"],
 easier:"Sit tall on the couch edge instead.",as:"AS can stiffen the rib joints and reduce chest expansion. Daily rib-expansion breathing is a staple of axSpA programs."},
catcow:{name:"Cat-cow",reps:"8–10 slow cycles",period:7,
 frames:[P("c106,106 h142,76",QUAD),P("c106,78 h137,99",QUAD)],
 cues:["Hands under shoulders, knees under hips","Inhale: chest forward, tailbone up, eyes ahead","Exhale: push the floor away and round gently"],
 easier:"Seated version on a chair, hands on knees.",note:"Wrists: make fists or come onto forearms if the wrists complain.",as:"Linger in the 'cow' (extension) half. Extension is the direction to protect with AS."},
thread:{name:"Thread-the-needle",reps:"5–6 per side",sided:1,period:8,
 frames:[P("E126,64 W124,40 h140,78",QUAD),P("n118,110 c100,104 h127,124 e133,113 w130,132 E104,124 W84,129",QUAD)],
 cues:["From all fours, reach one arm to the ceiling and watch the hand","Then slide it under your body, shoulder toward the floor","Exhale as you thread, inhale as you open"],
 easier:"Smaller range: keep your head off the floor.",as:"Mid-back (thoracic) rotation is often the first thing AS stiffens."},
openbook:{name:"Open books",reps:"6 per side",sided:1,period:8,view:"top",
 frames:[P("h40,90 n56,90 p104,90 e56,111 w57,132 E60,110 W62,130 k104,117 a130,117 K107,114 A133,114"),P("h42,86 n56,90 p104,90 e56,111 w57,132 E58,69 W58,48 k104,117 a130,117 K107,114 A133,114")],
 cues:["Lie on your side, knees bent to hip height, arms stacked in front","Sweep the top arm open and rotate your chest to the ceiling","Knees stay together; eyes follow the hand"],
 easier:"Pillow under your head; stop where it's comfortable.",as:"Unloaded rotation, a safe way to keep the mid-back moving."},
wallangel:{name:"Wall angels",reps:"8–10 slow reps",period:6,view:"front",props:["wallb"],
 frames:[P("e78,42 w78,20 E122,42 W122,20",STAND_F),P("e86,22 w94,4 E114,22 W106,4",STAND_F)],
 cues:["Back to the wall: hips, upper back and head touching (or close)","Arms in a goalpost, slide them up and down slowly","Ribs down; don't arch the low back off the wall"],
 easier:"Step your feet 30 cm out, or do it lying on the floor.",as:"Also a posture check. Watch your head-to-wall gap shrink over the weeks."},
lunge:{name:"Hip-flexor lunge + reach",reps:"hold & pulse the reach",sided:1,period:7,
 frames:[P("h101,50 n100,64 p100,106 e110,84 w120,100 k126,106 a128,134 K80,133 A55,134"),P("h97,50 n98,64 p108,110 e100,42 w102,20 k132,106 a130,134 K82,133 A57,134")],
 cues:["Half-kneel, back knee on a cushion, squeeze the back glute","Tuck the pelvis slightly and shift hips forward","Reach the back-leg-side arm up and slightly back"],
 easier:"Hold a couch or wall for balance; skip the reach.",as:"Tight hip flexors pull you into a stoop. This opens the front of the hip and adds gentle extension."},
ninety:{name:"90/90 hip switches",reps:"8–10 switches",period:8,view:"front",
 frames:[P("h100,72 n100,86 p100,126 e84,108 w80,130 E116,108 W120,130 k84,106 a76,134 K116,106 A124,134"),
         P("h100,72 n100,86 p100,126 e84,108 w80,130 E116,108 W120,130 k66,124 a76,134 K92,122 A124,134"),
         P("h100,72 n100,86 p100,126 e84,108 w80,130 E116,108 W120,130 k84,106 a76,134 K116,106 A124,134"),
         P("h100,72 n100,86 p100,126 e84,108 w80,130 E116,108 W120,130 k108,122 a76,134 K134,124 A124,134")],
 cues:["Sit tall, feet wider than hips, hands behind you","Let both knees fall to one side, then lift and switch","Slow and controlled; chest stays lifted"],
 easier:"Lean back on your hands more and use a smaller range.",as:"Hip rotation is often limited with AS and PsA. Small daily doses help."},
wgs:{name:"World's greatest stretch",reps:"4–5 per side",sided:1,period:9,
 frames:[P("h157,74 n145,82 p112,110 e142,108 w138,132 k140,108 a145,134 K86,122 A60,132"),P("h148,64 n140,78 p112,110 e140,106 w138,132 E140,58 W138,36 k140,108 a145,134 K86,122 A60,132")],
 cues:["Long lunge, both hands inside the front foot","Rotate and reach the inside arm to the ceiling","Back leg long; switch sides at halfway"],
 easier:"Drop the back knee to the floor.",as:"Hip-flexor opening plus thoracic rotation in one move."},
bridge:{name:"Glute bridge",reps:"10–15 reps, 2s squeeze at top",period:5,
 frames:[P("e70,131 w90,132 k114,104 a124,134",SUP),P("n50,126 p92,108 e70,131 w90,132 k116,99 a124,134",SUP)],
 cues:["Feet flat, hip-width, heels close to your hips","Drive through the heels and squeeze glutes to lift","Ribs down. Lift with the glutes, not by arching the low back"],
 easier:"Smaller lift range.",harder:"Single-leg bridge, or 3s lowering.",as:"Strong hip extensors support an upright posture."},
boxsquat:{name:"Squat to couch",reps:"10–15 reps, 3s down",period:5,props:["couchL"],
 frames:[P("h104,26 n102,40 p100,82 e116,52 w134,54 k102,108 a100,134"),P("h108,54 n98,66 p76,106 e114,72 w132,72 k104,106 a102,134")],
 cues:["Feet shoulder-width, couch right behind you","Sit back until you lightly touch the couch, then stand tall","Chest proud, knees track over toes"],
 easier:"Sit fully down, then stand, using hands on knees if needed.",harder:"Hover 2s just above the couch.",as:"Hinge at the hips and keep the spine long. No rounding under load."},
split:{name:"Split squat",reps:"8–10 per side",sided:1,period:5,
 frames:[P("h105,28 n104,42 p104,84 e94,62 w102,82 k126,108 a130,134 K88,110 A72,132"),P("h103,50 n102,64 p102,106 e92,84 w100,104 k128,106 a130,134 K90,132 A68,132")],

 $("#addHint").textContent=RUN.addons.length?"Want to keep going?":"Got a few more minutes?";
 $("#plusSub").textContent=`${SESS[RUN.day].t} · ${LVL[RUN.lvl-1]}`;$("#abSub").textContent=`AS-friendly core · ${LVL[RUN.lvl-1]}`;
 $("#dLog").innerHTML="<b style='color:var(--tx)'>Recent</b>"+log.slice(-6).reverse().map(x=>`<div>${x.date} · ${x.session} · ${x.length}${x.intensity?" · "+x.intensity.split(" · ")[1]:""}${x.addons&&x.addons.length?" · + "+x.addons.join(", "):""}${x.moved!=null?` · ${fmt(x.moved)} moving`:""}</div>`).join("");
 show("done");unwake();}
$("#doneBtn").onclick=()=>{musicStop();W=null;RUN=null;renderStart();show("start");};

/* ---------- Animation loop ---------- */
let at=0,lt=performance.now();
function frame(now){const dt=now-lt;lt=now;if(!(W&&W.paused))at+=dt;
 const m=$("#mainFig");if(m._ex&&!$("#play").classList.contains("hidden")){const frac=W&&W.phase==="work"&&!W.done?W.el/W.dur:(W&&W.phase!=="work"?0:null);drawPose(m,poseAt(m._ex,at,m._ex.sync?frac:null));}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.MS={renderLoop,EX,vr,buildFig,drawPose,MUS,ABS,BONUS,SESS,get W(){return W},get RUN(){return RUN}};
syncBar();renderStart();
})();
</script>
